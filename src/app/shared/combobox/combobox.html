<input
  #input
  class="input combobox__input"
  type="text"
  role="combobox"
  autocomplete="off"
  aria-autocomplete="list"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="listId"
  [attr.aria-activedescendant]="activeIndex() >= 0 ? optionId(activeIndex()) : null"
  [value]="value()"
  [disabled]="disabled()"
  (input)="onInput(input.value)"
  (keydown)="onKeydown($event)"
  (blur)="close()"
/>
@if (!disabled()) {
<button
  type="button"
  class="combobox__toggle"
  tabindex="-1"
  [attr.aria-label]="'common.showOptions' | translate"
  (mousedown)="$event.preventDefault()"
  (click)="toggle(input)"
>
  <app-icon name="chevron-down" size="small" />
</button>
}

@if (open() && filtered().length) {
  <ul class="combobox__list" role="listbox" [id]="listId">
    @for (option of filtered(); track option; let i = $index) {
      <li
        role="option"
        class="combobox__option"
        [id]="optionId(i)"
        [class.combobox__option--active]="i === activeIndex()"
        [attr.aria-selected]="option === value()"
        (mousedown)="$event.preventDefault()"
        (click)="select(option)"
      >
        {{ option }}
        @if (option === value()) {
          <app-icon name="check" size="small" />
        }
      </li>
    }
  </ul>
}
