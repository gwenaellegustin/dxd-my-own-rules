@if (open()) {
  <aside class="panel" [attr.aria-label]="titleKey() | translate">
    <div class="panel__head">
      <button type="button" class="panel__title" [attr.aria-expanded]="true" (click)="openChange.emit(false)">
        <h2 class="text-heading">{{ titleKey() | translate }}</h2>
        <span class="icon-button icon-button--primary"><app-icon name="left-panel-close" /></span>
        <span class="visually-hidden">{{ 'common.collapse' | translate }}</span>
      </button>

      <div class="search">
        <app-clearable>
          <input
            #clearTarget
            type="search"
            class="input"
            [placeholder]="'common.search' | translate"
            [attr.aria-label]="'common.search' | translate"
            [value]="query()"
            (input)="query.set($any($event.target).value)"
          />
        </app-clearable>
        <app-icon name="search" size="small" />
      </div>

      @if (newLabelKey(); as newLabel) {
        <button type="button" class="button-subtle" (click)="create.emit()">
          <app-icon name="plus-circle" size="small" />
          {{ newLabel | translate }}
        </button>
      }
    </div>

    <div class="panel__scroll">
      @for (group of visibleGroups(); track group.id) {
        <section class="group">
          @if (group.titleKey) {
            <h3 class="text-subheading">{{ group.titleKey | translate }}</h3>
          }
          @for (card of group.cards; track card.id) {
            <button
              type="button"
              class="card"
              [class.card--selected]="card.id === selectedId()"
              [attr.aria-current]="card.id === selectedId() ? 'true' : null"
              (click)="selectCard.emit(card.id)"
            >
              <!-- Brand logo when known. Otherwise the vehicle on the lift (work in progress),
                   else a car or a motorcycle (brand "kind") -->
              @let brand = brands.brandOf(card.vehicle);
              @if (brand?.logo; as logo) {
                <span class="card__logo" aria-hidden="true" [style.mask-image]="'url(' + logo + ')'"></span>
              } @else {
                <app-icon
                  [name]="card.onLift ? 'lift' : brand?.kind === 'motorcycle' ? 'motorcycle' : 'car'"
                  size="xlarge"
                />
              }
              <span class="card__body">
                <span class="card__title">
                  @if (card.vehicle || card.client) {
                    {{ card.vehicle }}@if (card.vehicle && card.client) { - }{{ card.client }}
                  } @else {
                    {{ untitledKey() | translate }}
                  }
                </span>
                @if (card.date) {
                  <span class="card__date">{{ card.date | date: 'dd.MM.yyyy' }}</span>
                }
              </span>
            </button>
          }
        </section>
      } @empty {
        <p class="text-secondary">{{ emptyKey() | translate }}</p>
      }
    </div>
  </aside>
} @else {
  <button type="button" class="rail" [attr.aria-expanded]="false" (click)="openChange.emit(true)">
    <span class="icon-button icon-button--primary"><app-icon [name]="icon()" /></span>
    <span class="rail__label text-heading">{{ titleKey() | translate }}</span>
  </button>
}
