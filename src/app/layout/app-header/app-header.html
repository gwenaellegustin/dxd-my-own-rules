<!-- Left: the pages, then back / forward (browser history) -->

<app-main-nav />

<div class="tools tools--history" role="group" [attr.aria-label]="'header.history' | translate">
  <button
    type="button"
    class="icon-button"
    [disabled]="!canGoBack()"
    [attr.aria-label]="'header.back' | translate"
    [attr.title]="'header.back' | translate"
    (click)="location.back()"
  >
    <app-icon name="back" />
  </button>
  <button
    type="button"
    class="icon-button"
    [disabled]="!canGoForward()"
    [attr.aria-label]="'header.forward' | translate"
    [attr.title]="'header.forward' | translate"
    (click)="location.forward()"
  >
    <app-icon name="forward" />
  </button>
</div>

<!-- TEMPORARY: shows / hides the brushed steel texture, to compare (see AppHeader.texture) -->
<button
  type="button"
  class="button-subtle texture-toggle"
  [attr.aria-pressed]="texture()"
  [attr.title]="'header.texture' | translate"
  (click)="toggleTexture()"
>
  {{ 'header.texture' | translate }}: {{ (texture() ? 'header.on' : 'header.off') | translate }}
</button>

<!-- Right: undo / redo (edits of the whole app), then the user menu (settings, language) -->
<div class="tools" role="group" [attr.aria-label]="'header.edits' | translate">
  <button
    type="button"
    class="icon-button"
    [disabled]="!history.canUndo()"
    [attr.aria-label]="'header.undo' | translate"
    [attr.title]="'header.undo' | translate"
    (click)="history.undo()"
  >
    <app-icon name="undo" />
  </button>
  <button
    type="button"
    class="icon-button"
    [disabled]="!history.canRedo()"
    [attr.aria-label]="'header.redo' | translate"
    [attr.title]="'header.redo' | translate"
    (click)="history.redo()"
  >
    <app-icon name="redo" />
  </button>
</div>

<div class="account" appDropdown #account="appDropdown">
  <button
    type="button"
    class="account__trigger"
    [attr.aria-expanded]="account.open()"
    aria-haspopup="menu"
    [attr.aria-label]="'account.menu' | translate"
    (click)="account.toggle()"
  >
    <img class="account__logo" src="images/logo.png" alt="" />
    <app-icon name="chevron-down" size="small" />
  </button>

  @if (account.open()) {
    <div class="dropdown-menu" role="menu">
      @if (user.currentUser(); as currentUser) {
        <p class="account__name">{{ currentUser.firstName }} {{ currentUser.lastName }}</p>
      }
      <a class="dropdown-menu__item" role="menuitem" routerLink="/settings/worksheet" (click)="account.close()">
        <app-icon name="settings" size="small" />
        {{ 'settings.title' | translate }}
      </a>

      <div class="dropdown-menu__item account__language">
        <app-icon name="language" size="small" />
        <span id="account-language">{{ 'account.language' | translate }}</span>
        <div class="segmented language" role="group" aria-labelledby="account-language">
          @for (lang of language.languages; track lang) {
            <button
              type="button"
              class="segmented__option"
              [class.segmented__option--active]="language.current() === lang"
              [attr.aria-pressed]="language.current() === lang"
              [attr.aria-label]="'languages.' + lang | translate"
              (click)="language.use(lang)"
            >
              {{ lang | uppercase }}
            </button>
          }
        </div>
      </div>
    </div>
  }
</div>
