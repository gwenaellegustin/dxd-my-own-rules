<!-- Tablet / desktop: one pill per page, the light shape under the current one (see MainNav) -->
<nav #bar class="pills" [class.pills--liquid]="place()" [attr.aria-label]="'nav.label' | translate">
  @if (place(); as shape) {
    <span
      class="liquid"
      [class.liquid--animated]="animated()"
      [class.liquid--to-left]="direction() === 'left'"
      [class.liquid--stretch-a]="animated() && moves() > 0 && moves() % 2 === 1"
      [class.liquid--stretch-b]="animated() && moves() > 0 && moves() % 2 === 0"
      [style.left.px]="shape.left"
      [style.right.px]="shape.right"
      aria-hidden="true"
    ></span>
  }
  @for (item of items; track item.path) {
    <ng-container *ngTemplateOutlet="link; context: { $implicit: item, cls: 'pill' }" />
  }
</nav>

<!-- Mobile: the current page; opens the list of pages -->
<div class="mobile" appDropdown #pages="appDropdown">
  <button
    type="button"
    class="pill pill--active mobile__button"
    aria-haspopup="menu"
    [attr.aria-expanded]="pages.open()"
    [attr.aria-label]="'nav.menu' | translate"
    (click)="pages.toggle()"
  >
    <app-icon name="menu" size="small" />
    @if (current(); as page) {
      <app-icon [name]="page.icon" size="small" />
      {{ page.labelKey | translate }}
    }
  </button>

  @if (pages.open()) {
    <nav class="dropdown-menu dropdown-menu--start" [attr.aria-label]="'nav.label' | translate">
      @for (item of items; track item.path) {
        <ng-container *ngTemplateOutlet="link; context: { $implicit: item, cls: 'dropdown-menu__item', close: pages }" />
      }
    </nav>
  }
</div>

<ng-template #link let-item let-cls="cls" let-close="close">
  <a
    [class]="cls"
    [routerLink]="item.path"
    routerLinkActive="{{ cls }}--active"
    ariaCurrentWhenActive="page"
    (click)="close?.close()"
  >
    <app-icon [name]="item.icon" size="small" />
    {{ item.labelKey | translate }}
    @if (item.badge?.(); as count) {
      <span class="problem-badge badge" [attr.aria-label]="'nav.badgeCount' | translate: { count }">{{ count }}</span>
    }
  </a>
</ng-template>
