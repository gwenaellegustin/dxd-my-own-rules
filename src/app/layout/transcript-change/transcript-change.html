@let target = targetLabel();
@let rollbackState = state();
<button
  type="button"
  class="change"
  [class.change--planned]="status() === 'planned'"
  [class.change--done]="status() === 'done'"
  [class.change--rolled-back]="rollbackState === 'rolled-back'"
  [class.change--with-rollback]="!!rollbackState"
  (click)="show.emit()"
>
  <span class="change__head">
    <app-icon [name]="targetIcon()" size="small" />
    <span class="change__target text-small">{{ target.key | translate: target.params }}</span>
    <span class="change__show text-small">
      {{ 'transcript.show' | translate }}
      <app-icon name="chevron-right" size="small" />
    </span>
  </span>
  <span class="change__field text-strong">{{ change().labelKey | translate }}</span>
  <span class="change__values">
    <span class="change__before" [attr.aria-label]="'transcript.before' | translate">
      <ng-container *ngTemplateOutlet="value; context: { text: change().before, status: change().statusBefore, final: false }" />
    </span>
    <app-icon name="chevron-right" size="small" aria-hidden="true" />
    <span class="change__after" [attr.aria-label]="'transcript.after' | translate">
      <ng-container *ngTemplateOutlet="value; context: { text: change().after, status: change().statusAfter, final: true }" />
    </span>
  </span>
</button>

<!-- Bottom right of the card (not inside it: a button cannot hold another one): rolls the change
     back, then applies it again; disabled once edited since or locked (invoiced, sent) -->
@if (rollbackState) {
  <button
    type="button"
    class="rollback"
    [disabled]="rollbackState === 'changed' || rollbackState === 'locked'"
    [attr.aria-label]="rollbackLabelKey() | translate"
    [attr.title]="rollbackLabelKey() | translate"
    (click)="toggleRollback()"
  >
    <app-icon [name]="rollbackState === 'rolled-back' ? 'redo' : 'undo'" size="small" />
  </button>
}

<!-- A value of a change: Planned / Done (the new status with a check of its colour), then the
     text; "empty" if none -->
<ng-template #value let-text="text" let-status="status" let-final="final">
  @if (status) {
    <span class="status status--{{ status }}">
      @if (final) {
        <app-icon name="check" size="small" />
      }
      <span class="change__text">{{ 'line.' + status | translate }}</span>
    </span>
  }
  @if (text) {
    <span class="change__text">{{ status ? '· ' : '' }}{{ text }}</span>
  } @else if (!status) {
    <span class="change__value--empty">{{ 'transcript.emptyValue' | translate }}</span>
  }
</ng-template>
