@if (open()) {
  <aside class="panel" [attr.aria-label]="'worksheets.title' | translate">
    <div class="panel__head">
      <button type="button" class="panel__title" [attr.aria-expanded]="true" (click)="openChange.emit(false)">
        <h2 class="text-heading">{{ 'worksheets.title' | translate }}</h2>
        <span class="icon-button icon-button--primary"><app-icon name="left-panel-close" /></span>
        <span class="visually-hidden">{{ 'common.collapse' | translate }}</span>
      </button>

      <div class="search">
        <app-clearable>
          <input
            #clearTarget
            type="search"
            class="input"
            [placeholder]="'common.search' | translate"
            [attr.aria-label]="'common.search' | translate"
            [value]="query()"
            (input)="query.set($any($event.target).value)"
          />
        </app-clearable>
        <app-icon name="search" size="small" />
      </div>

      <button type="button" class="button-subtle" (click)="createWorksheet.emit()">
        <app-icon name="plus-circle" size="small" />
        {{ 'worksheets.new' | translate }}
      </button>
    </div>

    <div class="panel__scroll">
      @for (group of groups(); track group.status) {
        <section class="group">
          @if (group.titleKey) {
            <h3 class="text-subheading">{{ group.titleKey | translate }}</h3>
          }
          @for (worksheet of group.worksheets; track worksheet.id) {
            <button
              type="button"
              class="card"
              [class.card--selected]="worksheet.id === selectedId()"
              [attr.aria-current]="worksheet.id === selectedId() ? 'true' : null"
              (click)="selectWorksheet.emit(worksheet.id)"
            >
              <!-- Brand logo when known. Otherwise the vehicle on the lift while the worksheet is
                   open, else a car or a motorcycle (brand "kind") -->
              @let brand = brands.brandOf(worksheet.vehicle);
              @if (brand?.logo; as logo) {
                <span class="card__logo" aria-hidden="true" [style.mask-image]="'url(' + logo + ')'"></span>
              } @else {
                <app-icon
                  [name]="worksheet.status === 'open' ? 'lift' : brand?.kind === 'motorcycle' ? 'motorcycle' : 'car'"
                  size="xlarge"
                />
              }
              <span class="card__body">
                <span class="card__title">
                  @if (worksheet.vehicle || worksheet.client) {
                    {{ worksheet.vehicle }}@if (worksheet.vehicle && worksheet.client) { - }{{ worksheet.client }}
                  } @else {
                    {{ 'worksheets.untitled' | translate }}
                  }
                </span>
                @if (worksheet.date) {
                  <span class="card__date">{{ worksheet.date | date: 'dd.MM.yyyy' }}</span>
                }
              </span>
            </button>
          }
        </section>
      } @empty {
        <p class="text-secondary">{{ 'worksheets.empty' | translate }}</p>
      }
    </div>
  </aside>
} @else {
  <button type="button" class="rail" [attr.aria-expanded]="false" (click)="openChange.emit(true)">
    <span class="icon-button icon-button--primary"><app-icon name="tool" /></span>
    <span class="rail__label text-heading">{{ 'worksheets.title' | translate }}</span>
  </button>
}
