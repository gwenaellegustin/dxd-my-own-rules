@let ws = worksheet();

<div class="fields">
  <label class="field">
    <span class="field__label">{{ 'worksheet.client' | translate }}</span>
    <app-combobox
      [value]="ws.client"
      [options]="clients.clientNames()"
      (valueChange)="fieldChange.emit({ client: $event })"
    />
  </label>

  <div class="field-row">
    <label class="field">
      <span class="field__label">{{ 'worksheet.vehicle' | translate }}</span>
      <app-combobox
        [value]="ws.vehicle"
        [options]="clients.vehiclesFor(ws.client)"
        (valueChange)="fieldChange.emit({ vehicle: $event })"
      />
    </label>
    <button
      type="button"
      class="icon-button icon-button--primary registration-button"
      aria-haspopup="dialog"
      [attr.aria-label]="'registration.open' | translate"
      [attr.title]="'registration.open' | translate"
      (click)="registrationOpen.set(true)"
    >
      <app-icon name="registration" />
    </button>
  </div>

  @if (registrationOpen()) {
    <app-registration-dialog
      [image]="ws.registrationImage"
      [note]="ws.registrationNote"
      (noteChange)="fieldChange.emit({ registrationNote: $event })"
      (closed)="registrationOpen.set(false)"
    />
  }

  <label class="field">
    <span class="field__label">{{ 'worksheet.date' | translate }}</span>
    <span class="date-field date-field--full">
      <input class="input" type="date" [value]="ws.date ?? ''" (change)="update('date', $event)" />
      <app-icon name="calendar" size="small" />
    </span>
  </label>

  <label class="field">
    <span class="field__label">{{ 'worksheet.kilometers' | translate }}</span>
    <app-clearable>
      <input #clearTarget class="input" type="text" inputmode="numeric" [value]="ws.kilometers" (input)="update('kilometers', $event)" />
    </app-clearable>
  </label>

  <div class="field-row hours">
    <label class="field">
      <span class="field__label">{{ 'worksheet.hours' | translate }}</span>
      <app-clearable>
        <textarea #clearTarget class="textarea" appAutoGrow appBulletList [value]="ws.hours" (input)="update('hours', $event)"></textarea>
      </app-clearable>
    </label>
    <button
      type="button"
      class="icon-button icon-button--primary"
      [attr.aria-label]="'worksheet.createInvoice' | translate"
      [attr.title]="'worksheet.createInvoice' | translate"
      (click)="createInvoice.emit()"
    >
      <app-icon name="invoice" />
    </button>
  </div>

  <label class="field">
    <span class="field__label">{{ 'worksheet.comments' | translate }}</span>
    <app-clearable>
      <textarea #clearTarget class="textarea" appAutoGrow appBulletList [value]="ws.comments" (input)="update('comments', $event)"></textarea>
    </app-clearable>
  </label>
</div>

<figure class="damage">
  <div
    class="damage__diagram"
    [class.damage__diagram--placing]="activeDamage()"
    (click)="placeDamage($event)"
  >
    <img src="images/car-damage-diagram.png" [alt]="'damage.diagramAlt' | translate" draggable="false" />
    @for (damage of ws.damages; track $index) {
      <button
        type="button"
        class="damage__marker"
        [style.left.%]="damage.x"
        [style.top.%]="damage.y"
        [attr.aria-label]="('damage.remove' | translate) + ' ' + ('damage.' + damage.type | translate)"
        (click)="$event.stopPropagation(); damageRemove.emit($index)"
      >
        <app-icon [name]="iconOf(damage.type)" size="small" />
      </button>
    }
  </div>

  <figcaption class="damage__legend" role="radiogroup" [attr.aria-label]="'damage.tools' | translate">
    @for (item of legend; track item.type) {
      <button
        type="button"
        class="damage__legend-item"
        [class.damage__legend-item--active]="activeDamage() === item.type"
        role="radio"
        [attr.aria-checked]="activeDamage() === item.type"
        (click)="toggleDamage(item.type)"
      >
        <app-icon [name]="item.icon" size="small" />
        {{ item.labelKey | translate }}
      </button>
    }
  </figcaption>
</figure>
