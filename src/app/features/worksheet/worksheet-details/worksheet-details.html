@let ws = worksheet();

<!-- Left column: the page's actions (projected, aligned with the fields), then the fields -->
<div class="main">
  <ng-content select="[actions]" />

  <div class="fields">
    <label class="field" data-area="client">
      <span class="field__label">{{ 'worksheet.client' | translate }}</span>
      <app-combobox
        [value]="ws.client"
        [options]="clients.clientNames()"
        [disabled]="locked()"
        (valueChange)="fieldChange.emit({ client: $event })"
      />
    </label>

    <div class="field-row">
      <label class="field" data-area="vehicle">
        <span class="field__label">{{ 'worksheet.vehicle' | translate }}</span>
        <app-combobox
          [value]="ws.vehicle"
          [options]="clients.vehiclesFor(ws.client)"
          [disabled]="locked()"
          (valueChange)="fieldChange.emit({ vehicle: $event })"
        />
      </label>
      <button
        type="button"
        class="icon-button icon-button--primary registration-button"
        aria-haspopup="dialog"
        [attr.aria-label]="'registration.open' | translate"
        [attr.title]="'registration.open' | translate"
        (click)="openVehicle()"
      >
        <app-icon name="registration" size="large" />
      </button>
    </div>

    @if (vehicleFile(); as file) {
      <app-vehicle-dialog
        [vehicle]="file.vehicle"
        [owner]="ws.client"
        [locked]="locked() || !file.clientId"
        (vehicleChange)="clients.updateVehicle(file.clientId, file.vehicle.id, $event)"
        (renamed)="vehicleRenamed.emit($event)"
        (closed)="vehicleRef.set(null)"
      />
    }

    <label class="field" data-area="date">
      <span class="field__label">{{ 'worksheet.date' | translate }}</span>
      <span class="date-field date-field--full">
        <input class="input" type="date" [disabled]="locked()" [value]="ws.date ?? ''" (change)="update('date', $event)" />
        <app-icon name="calendar" size="small" />
      </span>
    </label>

    <label class="field" data-area="kilometers">
      <span class="field__label">{{ 'worksheet.kilometers' | translate }}</span>
      <app-clearable>
        <input #clearTarget class="input" type="text" inputmode="numeric" [disabled]="locked()" [value]="ws.kilometers" (input)="update('kilometers', $event)" />
      </app-clearable>
    </label>

    <label class="field" data-area="hours">
      <span class="field__label">{{ 'worksheet.hours' | translate }}</span>
      <app-clearable>
        <textarea #clearTarget class="textarea" appAutoGrow appBulletList [disabled]="locked()" [value]="ws.hours" (input)="update('hours', $event)"></textarea>
      </app-clearable>
    </label>

    <label class="field" data-area="comments">
      <span class="field__label">{{ 'worksheet.comments' | translate }}</span>
      <app-clearable>
        <textarea #clearTarget class="textarea" appAutoGrow appBulletList [disabled]="locked()" [value]="ws.comments" (input)="update('comments', $event)"></textarea>
      </app-clearable>
    </label>

  </div>
</div>

<figure class="damage">
  <div
    class="damage__diagram"
    [class.damage__diagram--placing]="activeDamage() && !locked()"
    (click)="placeDamage($event)"
  >
    <img src="images/car-damage-diagram.png" [alt]="'damage.diagramAlt' | translate" draggable="false" />
    @for (damage of ws.damages; track $index) {
      <button
        type="button"
        class="damage__marker"
        [style.left.%]="damage.x"
        [style.top.%]="damage.y"
        [disabled]="locked()"
        [attr.aria-label]="('damage.remove' | translate) + ' ' + ('damage.' + damage.type | translate)"
        (click)="$event.stopPropagation(); damageRemove.emit($index)"
      >
        <app-icon [name]="iconOf(damage.type)" size="small" />
      </button>
    }
  </div>

  <figcaption class="segmented damage__legend" role="radiogroup" [attr.aria-label]="'damage.tools' | translate">
    @for (item of legend; track item.type) {
      <button
        type="button"
        class="segmented__option"
        [class.segmented__option--active]="activeDamage() === item.type"
        role="radio"
        [attr.aria-checked]="activeDamage() === item.type"
        [disabled]="locked()"
        (click)="toggleDamage(item.type)"
      >
        <app-icon [name]="item.icon" size="small" />
        {{ item.labelKey | translate }}
      </button>
    }
  </figcaption>
</figure>
